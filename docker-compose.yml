version: '3.8'

services:
  license-server:
    image: ghcr.io/wlk199718/license-server:latest
    container_name: license-server
    restart: always
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9000:9000"
    volumes:
      - ./data:/app/data
    environment:
      - ADMIN_KEY=${ADMIN_KEY:?Set ADMIN_KEY in .env}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
      - SESSION_SECRET=${SESSION_SECRET:?Set SESSION_SECRET in .env}
      - DATABASE_URL=sqlite+aiosqlite:///./data/license.db
      - DATA_DIR=/app/data
      - SIGNING_PRIVATE_KEY_PATH=/app/data/license_private.pem
      - HEARTBEAT_INTERVAL=${HEARTBEAT_INTERVAL:-60}
      - ONLINE_TIMEOUT=${ONLINE_TIMEOUT:-180}
      - DEVICE_BINDING_TTL=${DEVICE_BINDING_TTL:-900}
      - VERIFY_IP_LIMIT=${VERIFY_IP_LIMIT:-1200}
      - HEARTBEAT_IP_LIMIT=${HEARTBEAT_IP_LIMIT:-6000}
      - VERIFY_DEVICE_LIMIT=${VERIFY_DEVICE_LIMIT:-12}
      - HEARTBEAT_DEVICE_LIMIT=${HEARTBEAT_DEVICE_LIMIT:-12}
      - INVALID_LICENSE_IP_LIMIT=${INVALID_LICENSE_IP_LIMIT:-120}
      - HEARTBEAT_LOG_RETENTION_DAYS=${HEARTBEAT_LOG_RETENTION_DAYS:-1}
      - SESSION_TTL=${SESSION_TTL:-2592000}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - HOST=0.0.0.0
      - PORT=9000
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
