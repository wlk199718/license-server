# Include inside Nginx's http {} block (normally /etc/nginx/conf.d/).
# Do not log $request, $request_uri, $args or request bodies: administrator
# routes/query parameters can contain legacy card secrets.
map $uri $license_log_route {
    default "[other]";
    / "/";
    /api/verify "/api/verify";
    /api/heartbeat "/api/heartbeat";
    /healthz "/healthz";
    /api/version "/api/version";
    ~^/admin/ "/admin/*";
    ~^/static/ "/static/*";
    ~^/api/ "/api/*";
}

log_format license_timing escape=json
    '{"event":"nginx_request","time":"$time_iso8601",'
    '"request_id":"$request_id","route":"$license_log_route",'
    '"status":$status,"client_ip":"$remote_addr",'
    '"request_time":"$request_time",'
    '"upstream_connect_time":"$upstream_connect_time",'
    '"upstream_header_time":"$upstream_header_time",'
    '"upstream_response_time":"$upstream_response_time",'
    '"upstream_status":"$upstream_status"}';
